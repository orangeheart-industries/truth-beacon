[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S101", "S603", "S607"]
"tests/*" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
